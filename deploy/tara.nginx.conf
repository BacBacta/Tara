# Reverse proxy Nginx pour Tara.
#
# Installation :
#   sudo cp deploy/tara.nginx.conf /etc/nginx/sites-available/tara
#   sudo ln -s /etc/nginx/sites-available/tara /etc/nginx/sites-enabled/tara
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les certificats sont obtenus AVANT d'activer le bloc 443 :
#   sudo certbot certonly --webroot -w /var/www/certbot -d tara.shop -d www.tara.shop

# --- HTTP : renouvellement ACME et redirection vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tara.shop www.tara.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tara.shop$request_uri;
    }
}

# --- HTTPS : www redirige vers le domaine nu (une seule URL canonique) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tara.shop;

    ssl_certificate     /etc/letsencrypt/live/tara.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tara.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://tara.shop$request_uri;
}

# --- HTTPS : le site ---
server {
    # Syntaxe d'Ubuntu 22.04 et 24.04 (nginx 1.18 et 1.24).
    # Sur nginx >= 1.25 uniquement, remplacer par « listen 443 ssl; » suivi
    # de « http2 on; » — la forme ci-dessous y déclenche un avertissement.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tara.shop;

    ssl_certificate     /etc/letsencrypt/live/tara.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tara.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Photos d'articles : le formulaire d'ajout envoie des images de téléphone.
    client_max_body_size 10M;

    # Un forfait data camerounais se consomme vite : on compresse le texte.
    # (les images et le PNG d'aperçu sont déjà compressés, on les laisse.)
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # ------------------------------------------------------------------
    # AUCUN en-tête de sécurité ici. next.config.mjs pose déjà CSP, HSTS,
    # X-Frame-Options, X-Content-Type-Options, Referrer-Policy et
    # Permissions-Policy. Les rajouter ici les DUPLIQUERAIT : le navigateur
    # appliquerait alors l'intersection des deux CSP, et la moindre
    # divergence entre les deux fichiers casserait l'embed TikTok ou le
    # pixel sans message d'erreur lisible.
    # Un seul endroit fait autorité : next.config.mjs.
    # ------------------------------------------------------------------

    # Les fichiers versionnés de Next ne changent jamais à URL constante.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Requis par src/lib/ratelimit.ts (clientIp lit x-forwarded-for) :
        # sans cet en-tête, tout le trafic compterait pour une seule IP et
        # le premier visiteur épuiserait le quota de tout le monde.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Sonde de disponibilité : ni journalisée, ni indexée.
    location = /api/sante {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }
}
